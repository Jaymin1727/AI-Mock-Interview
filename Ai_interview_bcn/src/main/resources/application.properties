# ===================================================
# Spring Boot Application Properties
# Values are loaded from the .env file via dotenv-java
# ===================================================

spring.application.name=ai-interview-backend

# Server
server.port=${SERVER_PORT:8080}

# Firebase
firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.api-key=${FIREBASE_API_KEY}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:src/main/resources/firebase-service-account.json}

# Gemini AI
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-1.5-pro}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Supabase
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}

# CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# JWT
jwt.secret=${JWT_SECRET:default_secret_change_me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.aiinterview=DEBUG
logging.level.org.springframework.security=INFO
